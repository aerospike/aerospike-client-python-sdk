[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aerospike-sdk"
dynamic = ["version"]
description = "Aerospike Python SDK - a modern, developer-friendly interface for Aerospike"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    # Dev-channel version published to the internal package index on every
    # PAC merge; promoted versions land on public PyPI at release. CI
    # resolves this from the internal index; see README "Local PAC checkout"
    # for working against a local PAC tree instead.
    "aerospike-async==0.6.0a7.dev27",
    "typing_extensions>=4.0.0",
    "pyyaml>=6.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Documentation = "https://aerospike.com/docs/develop/client/sdk/"
"API Reference" = "https://aerospike-python-sdk.readthedocs.io/"
Repository = "https://github.com/aerospike/aerospike-client-python-sdk"
Issues = "https://github.com/aerospike/aerospike-client-python-sdk/issues"
Changelog = "https://github.com/aerospike/aerospike-client-python-sdk/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-env>=1.1.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-PyYAML",
]
docs = [
    "sphinx>=8.0",
    "furo",
    "myst-parser>=4.0",
    "sphinx-design",
    "sphinx-autodoc-typehints",
    "sphinx-autobuild",
]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
include = ["aerospike_sdk*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Module-scoped fixtures must share a session-scoped event loop with the
# tests that use them.
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
addopts = "-s"
markers = [
    "requires_server_compiled_ael: needs connected client with server-compiled AEL (see tests/integration/conftest.py)",
    "requires_query_selection: needs connected client with field 44 query selection (see tests/integration/conftest.py)",
]
testpaths = ["tests"]
python_files = ["*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
log_cli = true
log_cli_level = "WARNING"
filterwarnings = [
    "ignore::DeprecationWarning:uvloop",
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]

[tool.basedpyright]
reportMissingImports = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# The CDT builders pass one-line lambda factories straight into a constructor;
# most are inline keyword arguments, and these are the same thunks that an
# if/else forced into a named binding. A `def` would add no clarity here.
"aerospike_sdk/query_shared.py" = ["E731"]
"aerospike_sdk/aio/operations/cdt_read.py" = ["E731"]
"aerospike_sdk/aio/operations/cdt_write.py" = ["E731"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

