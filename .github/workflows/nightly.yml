name: Nightly

# Pull-request CI (.github/workflows/build-test.yml) is one node of the minimum
# supported server, with no security, no TLS, and no strong consistency. The
# suites that need those shapes skip. Nightly is the matrix below, on the newest
# supported Python. Bump PYTHON_VERSION when 3.15 becomes that interpreter.
#
# 1. Floating canary — newest release or RC, resolved when the job runs. A
#    failure does not fail this workflow. This is the coverage above 8.2.0.
# 2. Server matrix — placeholder. Pinned 8.1.2.0 is deferred (CLIENT-5616).
# 3. Multi-node SC — pinned 8.2.0.0, blocking. Rosters, MRTs, SC across nodes.
# 4. Commit status — pinned 8.2.0.0, blocking. Single-node SC for the gated
#    commit tests. roster.py only prepares that cluster; it is not a test.
# 5. Security / auth — pinned 8.2.0.0, blocking. string_masking_test.
# 6. TLS — pinned 8.2.0.0, blocking.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  JF_URL: https://artifact.aerospike.io
  PYTHON_VERSION: "3.14"
  # Pinned jobs (SC, commit status, security, TLS). The canary resolves its own tag.
  AEROSPIKE_SERVER_TAG: "8.2.0.0"
  AEROSPIKE_SERVER_REPO: database-docker-test-local/aerospike-server-enterprise
  # Keep the tag and the image reference together. The server action pulls the
  # tag; the role grant and the authenticated build check reuse the image.
  AEROSPIKE_TOOLS_TAG: 12.1.1_2
  AEROSPIKE_TOOLS_IMAGE: aerospike.jfrog.io/database-docker-virtual/aerospike-tools:12.1.1_2

jobs:
  floating-canary:
    name: Floating canary (newest release/RC)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # A red canary must not fail the nightly run.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/install-sdk
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          jf-project: ${{ vars.JFROG_PROJECT }}
          oidc-provider-name: ${{ vars.OIDC_PROVIDER_NAME || 'gh-aerospike' }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE || 'aerospike' }}

      # Registry tags, not the moving `latest` or `8.2` aliases. `latest` is
      # still 8.1.2.5; the 8.2 alias is a nightly. This job wants a release
      # or RC at or above the 8.2.0 floor.
      - name: Resolve newest release or RC
        id: resolve
        run: |
          set -euo pipefail
          json=$(jf rt curl -s "/api/docker/database-docker-virtual/v2/aerospike-server-enterprise/tags/list")
          tag=$(printf '%s\n' "$json" | python3 .github/resolve-server-tag.py)
          build=$(printf '%s\n' "$tag" | python3 -c 'import re,sys; m=re.match(r"(\d+\.\d+\.\d+\.\d+)", sys.stdin.read().strip()); print(m.group(1) if m else "")')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Resolved server tag: $tag"

      # server-container-repo stays at the action default (the virtual repo),
      # where releases and RCs are published.
      - name: Start resolved Aerospike server
        id: aerospike
        uses: aerospike/shared-workflows/.github/actions/setup-aerospike-server@e7e19785e3f372ee5bbfa8100f8453e55dd511e5 # server cert SAN includes aerospike-tls; client cert is v3
        with:
          server-tag: ${{ steps.resolve.outputs.tag }}
          config-file: .github/aerospike.conf
          oidc-provider: ${{ vars.OIDC_PROVIDER_NAME || 'gh-aerospike' }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE || 'aerospike' }}

      - name: Assert the server is up and enterprise
        env:
          EXPECTED_BUILD: ${{ steps.resolve.outputs.build }}
        run: python3 .github/assert-server.py

      - name: Run unit tests
        id: unit
        run: python -m pytest tests/unit -v --cov=aerospike_sdk --cov-report=term --cov-fail-under=65

      - name: Run integration tests
        id: integration
        env:
          AEROSPIKE_HOST: 127.0.0.1:3000
          AEROSPIKE_USE_SERVICES_ALTERNATE: "true"
        run: |
          set -euo pipefail
          rm -f aerospike.env
          python -m pytest tests/integration -v

      - name: Server logs
        if: failure()
        run: |
          IFS=',' read -ra names <<< "${{ steps.aerospike.outputs.container-names }}"
          for name in "${names[@]}"; do
            [ -z "$name" ] && continue
            echo "=== ${name} (last 100 lines) ==="
            docker logs --tail 100 "$name" || true
          done

  server-matrix:
    name: Server matrix (8.1.2.0, deferred)
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: |
          echo "Pinned 8.1.2.0 coverage is not in this nightly yet."
          echo "It will block, and it covers sub-floor supports_* guards."
          echo "Tracked by https://aerospike.atlassian.net/browse/CLIENT-5616"

  sc-cluster:
    name: Multi-node SC
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/install-sdk
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          jf-project: ${{ vars.JFROG_PROJECT }}
          oidc-provider-name: ${{ vars.OIDC_PROVIDER_NAME || 'gh-aerospike' }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE || 'aerospike' }}

      # Custom config names the key file, so the basename has to be stable.
      # features-content would land under a random temp name.
      - name: Write feature key
        env:
          FEATURES_CONTENT: ${{ secrets.AEROSPIKE_SERVER_FEATURES_CONF }}
        run: |
          set -euo pipefail
          if [ -z "${FEATURES_CONTENT}" ]; then
            echo "::error::AEROSPIKE_SERVER_FEATURES_CONF is not set"
            exit 1
          fi
          printf '%s\n' "$FEATURES_CONTENT" > "${{ runner.temp }}/features.conf"

      - name: Start 3-node strong-consistency cluster
        id: aerospike
        uses: aerospike/shared-workflows/.github/actions/setup-aerospike-server@e7e19785e3f372ee5bbfa8100f8453e55dd511e5 # server cert SAN includes aerospike-tls; client cert is v3
        with:
          server-tag: ${{ env.AEROSPIKE_SERVER_TAG }}
          server-container-repo: ${{ env.AEROSPIKE_SERVER_REPO }}
          num-nodes: "3"
          enable-strong-consistency: "true"
          features-file: ${{ runner.temp }}/features.conf
          config-file: .github/aerospike-sc.conf
          container-name-prefix: aerospike-sc
          startup-timeout: "90"
          sc-stability-timeout-seconds: "60"
          tools-tag: ${{ env.AEROSPIKE_TOOLS_TAG }}
          oidc-provider: ${{ vars.OIDC_PROVIDER_NAME || 'gh-aerospike' }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE || 'aerospike' }}

      - name: Assert the server is the one we asked for
        env:
          EXPECTED_BUILD: ${{ env.AEROSPIKE_SERVER_TAG }}
        run: python3 .github/assert-server.py

      # Namespace test is strong consistency, so transaction and durable-delete
      # tests run instead of skipping. The gated commit tests need their own
      # single-node cluster and run in the commit-status job. Security stays
      # on the security job.
      #
      # services-alternate stays off. This config publishes no
      # alternate-access-address, and with the flag on the client keeps only
      # the seed. Partitions owned by the other two nodes then fail to route.
      - name: Run integration tests and strong-consistency examples
        env:
          AEROSPIKE_HOST: 127.0.0.1:3000
          AEROSPIKE_HOST_SC: 127.0.0.1:3000
          AEROSPIKE_USE_SERVICES_ALTERNATE: "false"
          AEROSPIKE_NAMESPACE: test
          AEROSPIKE_SC_NAMESPACE: test
        run: |
          set -euo pipefail
          rm -f aerospike.env
          python -m pytest tests/integration -v --junitxml="$RUNNER_TEMP/integration.xml"
          python3 .github/assert-junit-executed.py "$RUNNER_TEMP/integration.xml" \
            tests/integration/async/txn_test.py \
            tests/integration/sync/txn_test.py \
            tests/integration/async/durable_delete_sc_test.py \
            tests/integration/sync/durable_delete_sc_test.py \
            tests/integration/async/implicit_batch_txn_test.py \
            tests/integration/sync/implicit_batch_txn_test.py

          run_example() {
            local file="$1"
            local marker="$2"
            local out status
            set +e
            out=$(python "$file" 2>&1)
            status=$?
            set -e
            printf '%s\n' "$out"
            if [ "$status" -ne 0 ]; then
              echo "::error::$file exited $status"
              exit "$status"
            fi
            if grep -q 'Skipped:' <<<"$out"; then
              echo "::error::$file skipped; the strong-consistency cluster was not used"
              exit 1
            fi
            if grep -q 'ERROR:' <<<"$out"; then
              echo "::error::$file reported an info error"
              exit 1
            fi
            if ! grep -q "$marker" <<<"$out"; then
              echo "::error::$file did not report completion ($marker)"
              exit 1
            fi
          }
          run_example examples/multi_record_transaction_example.py "Overall: SUCCESS"
          run_example examples/roster_example.py "Roster initialization complete."

      - name: Server logs
        if: failure()
        run: |
          IFS=',' read -ra names <<< "${{ steps.aerospike.outputs.container-names }}"
          for name in "${names[@]}"; do
            [ -z "$name" ] && continue
            echo "=== ${name} (last 100 lines) ==="
            docker logs --tail 100 "$name" || true
          done

  commit-status:
    name: Commit status
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/install-sdk
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          jf-project: ${{ vars.JFROG_PROJECT }}
          oidc-provider-name: ${{ vars.OIDC_PROVIDER_NAME || 'gh-aerospike' }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE || 'aerospike' }}

      # No config-file: the action renders namespace test at replication-factor 1
      # and stages its roster. The feature key is still required for SC.
      - name: Start single-node strong-consistency cluster
        id: aerospike
        uses: aerospike/shared-workflows/.github/actions/setup-aerospike-server@e7e19785e3f372ee5bbfa8100f8453e55dd511e5 # server cert SAN includes aerospike-tls; client cert is v3
        with:
          server-tag: ${{ env.AEROSPIKE_SERVER_TAG }}
          server-container-repo: ${{ env.AEROSPIKE_SERVER_REPO }}
          num-nodes: "1"
          enable-strong-consistency: "true"
          features-content: ${{ secrets.AEROSPIKE_SERVER_FEATURES_CONF }}
          container-name-prefix: aerospike-sc-single
          startup-timeout: "60"
          sc-stability-timeout-seconds: "30"
          tools-tag: ${{ env.AEROSPIKE_TOOLS_TAG }}
          oidc-provider: ${{ vars.OIDC_PROVIDER_NAME || 'gh-aerospike' }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE || 'aerospike' }}

      - name: Assert the server is the one we asked for
        env:
          EXPECTED_BUILD: ${{ env.AEROSPIKE_SERVER_TAG }}
        run: python3 .github/assert-server.py

      # These tests skip unless AEROSPIKE_HOST_SC_SINGLE answers. One node
      # owns every partition, which is what force_single_node() needs. The
      # action stages the roster; roster.py is only the local helper for that.
      - name: Run commit-status tests
        env:
          AEROSPIKE_HOST_SC_SINGLE: 127.0.0.1:3000
          AEROSPIKE_SC_NAMESPACE: test
        run: |
          set -euo pipefail
          rm -f aerospike.env
          python -m pytest \
            tests/integration/async/txn_commit_status_test.py \
            tests/integration/sync/txn_commit_status_test.py \
            -v --junitxml="$RUNNER_TEMP/commit-status.xml"
          python3 .github/assert-junit-executed.py --forbid-skips \
            "$RUNNER_TEMP/commit-status.xml" \
            tests/integration/async/txn_commit_status_test.py \
            tests/integration/sync/txn_commit_status_test.py

      - name: Server logs
        if: failure()
        run: |
          IFS=',' read -ra names <<< "${{ steps.aerospike.outputs.container-names }}"
          for name in "${names[@]}"; do
            [ -z "$name" ] && continue
            echo "=== ${name} (last 100 lines) ==="
            docker logs --tail 100 "$name" || true
          done

  security:
    name: Security / auth
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/install-sdk
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          jf-project: ${{ vars.JFROG_PROJECT }}
          oidc-provider-name: ${{ vars.OIDC_PROVIDER_NAME || 'gh-aerospike' }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE || 'aerospike' }}

      - name: Start security-enabled server
        id: aerospike
        uses: aerospike/shared-workflows/.github/actions/setup-aerospike-server@e7e19785e3f372ee5bbfa8100f8453e55dd511e5 # server cert SAN includes aerospike-tls; client cert is v3
        with:
          server-tag: ${{ env.AEROSPIKE_SERVER_TAG }}
          server-container-repo: ${{ env.AEROSPIKE_SERVER_REPO }}
          num-nodes: "1"
          enable-security: "true"
          config-file: .github/aerospike.conf
          container-name-prefix: aerospike-sec
          startup-timeout: "60"
          tools-tag: ${{ env.AEROSPIKE_TOOLS_TAG }}
          oidc-provider: ${{ vars.OIDC_PROVIDER_NAME || 'gh-aerospike' }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE || 'aerospike' }}

      - name: Grant admin the roles the suite needs
        uses: ./.github/actions/grant-admin-roles
        with:
          tools-image: ${{ env.AEROSPIKE_TOOLS_IMAGE }}

      - name: Assert the server is the one we asked for
        env:
          EXPECTED_BUILD: ${{ env.AEROSPIKE_SERVER_TAG }}
          SERVER_USER: admin
          SERVER_PASSWORD: admin
          TOOLS_IMAGE: ${{ env.AEROSPIKE_TOOLS_IMAGE }}
        run: python3 .github/assert-server.py

      # string_masking_test skips unless AEROSPIKE_HOST_SEC points at a
      # security-enabled 8.2.0+ server. This job is that server.
      - name: Run string masking tests
        env:
          AEROSPIKE_HOST_SEC: 127.0.0.1:3000
          AEROSPIKE_USE_SERVICES_ALTERNATE: "true"
          AEROSPIKE_AUTH_USER: admin
          AEROSPIKE_AUTH_PASSWORD: admin
        run: |
          set -euo pipefail
          rm -f aerospike.env
          python -m pytest tests/integration/async/string_masking_test.py -v \
            --junitxml="$RUNNER_TEMP/masking.xml"
          python3 .github/assert-junit-executed.py --forbid-skips \
            "$RUNNER_TEMP/masking.xml" \
            tests/integration/async/string_masking_test.py

      - name: Server logs
        if: failure()
        run: |
          IFS=',' read -ra names <<< "${{ steps.aerospike.outputs.container-names }}"
          for name in "${names[@]}"; do
            [ -z "$name" ] && continue
            echo "=== ${name} (last 100 lines) ==="
            docker logs --tail 100 "$name" || true
          done

  tls-smoke:
    name: TLS
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/install-sdk
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          jf-project: ${{ vars.JFROG_PROJECT }}
          oidc-provider-name: ${{ vars.OIDC_PROVIDER_NAME || 'gh-aerospike' }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE || 'aerospike' }}

      # features-content would land under a random temp name. The config
      # below names the key file, so the basename has to be stable.
      - name: Write feature key
        env:
          FEATURES_CONTENT: ${{ secrets.AEROSPIKE_SERVER_FEATURES_CONF }}
        run: |
          set -euo pipefail
          if [ -z "${FEATURES_CONTENT}" ]; then
            echo "::error::AEROSPIKE_SERVER_FEATURES_CONF is not set"
            exit 1
          fi
          printf '%s\n' "$FEATURES_CONTENT" > "${{ runner.temp }}/features.conf"

      # Cleartext 3000, TLS 4333, tls-name aerospike-tls. Certs come from the
      # action. alternate-access-address 127.0.0.1 is what login-only reads
      # for the cleartext data port. Security is on so that login has a
      # credential exchange to move off the TLS port.
      - name: Start TLS server
        id: aerospike
        uses: aerospike/shared-workflows/.github/actions/setup-aerospike-server@e7e19785e3f372ee5bbfa8100f8453e55dd511e5 # server cert SAN includes aerospike-tls; client cert is v3
        with:
          server-tag: ${{ env.AEROSPIKE_SERVER_TAG }}
          server-container-repo: ${{ env.AEROSPIKE_SERVER_REPO }}
          num-nodes: "1"
          enable-tls: "true"
          enable-security: "true"
          features-file: ${{ runner.temp }}/features.conf
          config-file: .github/aerospike-tls.conf
          container-name-prefix: aerospike-tls
          startup-timeout: "60"
          tools-tag: ${{ env.AEROSPIKE_TOOLS_TAG }}
          oidc-provider: ${{ vars.OIDC_PROVIDER_NAME || 'gh-aerospike' }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE || 'aerospike' }}

      - name: Grant admin the roles the suite needs
        uses: ./.github/actions/grant-admin-roles
        with:
          tools-image: ${{ env.AEROSPIKE_TOOLS_IMAGE }}

      - name: Assert the server is the one we asked for
        env:
          EXPECTED_BUILD: ${{ env.AEROSPIKE_SERVER_TAG }}
          SERVER_USER: admin
          SERVER_PASSWORD: admin
          TOOLS_IMAGE: ${{ env.AEROSPIKE_TOOLS_IMAGE }}
        run: python3 .github/assert-server.py

      - name: Run TLS tests
        env:
          AEROSPIKE_TLS_HOST: 127.0.0.1:${{ steps.aerospike.outputs.tls-service-ports }}
          AEROSPIKE_HOST_TLS: 127.0.0.1:${{ steps.aerospike.outputs.tls-service-ports }}
          AEROSPIKE_HOST_TLS_LOGIN: 127.0.0.1:${{ steps.aerospike.outputs.tls-service-ports }}
          AEROSPIKE_TLS_NAME: aerospike-tls
          AEROSPIKE_TLS_CA_FILE: ${{ steps.aerospike.outputs.tls-cert-dir }}/ca.crt
          AEROSPIKE_TLS_CLIENT_CERT_FILE: ${{ steps.aerospike.outputs.tls-cert-dir }}/client.crt
          AEROSPIKE_TLS_CLIENT_KEY_FILE: ${{ steps.aerospike.outputs.tls-cert-dir }}/client.key
          AEROSPIKE_USER: admin
          AEROSPIKE_PASSWORD: admin
        run: |
          set -euo pipefail
          rm -f aerospike.env
          python -m pytest tests/integration/async/tls_test.py -v \
            --junitxml="$RUNNER_TEMP/tls.xml"
          python3 .github/assert-junit-executed.py --forbid-skips \
            "$RUNNER_TEMP/tls.xml" \
            tests/integration/async/tls_test.py

      - name: Server logs
        if: failure()
        run: |
          IFS=',' read -ra names <<< "${{ steps.aerospike.outputs.container-names }}"
          for name in "${names[@]}"; do
            [ -z "$name" ] && continue
            echo "=== ${name} (last 100 lines) ==="
            docker logs --tail 100 "$name" || true
          done
