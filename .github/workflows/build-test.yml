name: CI Build & Test

on:
  pull_request:
    branches:
      - dev
      - stage
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  # Advisory only (never fails the build): flag when the pinned PAC commit has
  # fallen behind PAC's dev branch, so a stale pin surfaces as a clear warning
  # instead of a cryptic downstream test failure. Bumping the pin stays manual.
  pac-pin-check:
    name: PAC pin freshness (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Warn if the PAC pin is behind PAC dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref=$(grep -oE 'aerospike-client-python-async\.git@[0-9a-f]+' pyproject.toml | head -1 | cut -d@ -f2)
          echo "Pinned PAC commit: $ref"
          if ! gh api "repos/aerospike/aerospike-client-python-async/compare/${ref}...dev" > cmp.json; then
            echo "::warning title=PAC pin check skipped::Could not compare pin to PAC dev (auth/network)."; exit 0
          fi
          # compare base=pin, head=dev: ahead_by = commits dev has that the pin
          # lacks (= how far the pin is BEHIND dev); behind_by = commits the pin
          # has that dev lacks (= pin is AHEAD of dev, e.g. an unmerged commit).
          behind=$(jq -r '.ahead_by' cmp.json)
          ahead=$(jq -r '.behind_by' cmp.json)
          newest=$(jq -r '(.commits[-1].sha // "")[0:9]' cmp.json)
          echo "PAC pin is $behind behind / $ahead ahead of dev (dev tip $newest)"
          if [ "$behind" = 0 ] && [ "$ahead" = 0 ]; then
            echo "PAC pin is at dev tip."
          elif [ "$ahead" = 0 ]; then
            echo "::warning title=PAC pin is behind dev::Pinned PAC is $behind commit(s) behind origin/dev (dev tip $newest). Bump the pin in pyproject.toml if you need newer PAC changes."
          elif [ "$behind" = 0 ]; then
            echo "::notice title=PAC pin ahead of dev::Pinned PAC is $ahead commit(s) ahead of origin/dev — likely an unmerged feature-branch commit. Fine for co-dev; land it on PAC dev before merging."
          else
            echo "::warning title=PAC pin diverged from dev::Pinned PAC has diverged from origin/dev ($ahead ahead, $behind behind). Confirm the pin is intentional."
          fi

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      # Pre-release alpha window: PSDK pins to a PAC version that hasn't
      # been published to PyPI yet. Build PAC from source as a sibling so
      # `pip install .` for the SDK finds the dependency already satisfied
      # and doesn't go to PyPI. Switch back to a plain PyPI install once
      # the matching PAC release lands on PyPI.
      - name: Read PAC ref from pyproject.toml
        run: |
          ref=$(grep -oE 'aerospike-client-python-async\.git@[^"]+' pyproject.toml | head -1 | cut -d@ -f2)
          echo "PAC_REF=$ref" >> "$GITHUB_ENV"
      - name: Checkout PAC source (sibling)
        uses: actions/checkout@v4
        with:
          repository: aerospike/aerospike-client-python-async
          ref: ${{ env.PAC_REF }}
          path: aerospike-client-python-async

      - name: Setup Rust toolchain (for PAC build)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Build & install PAC from source
        working-directory: aerospike-client-python-async
        run: |
          # `maturin develop` requires an active virtualenv; GitHub-hosted
          # runners use the system Python without one. Build a wheel and
          # `pip install` it instead — same end state, no venv required.
          pip install maturin
          maturin build --release --out dist
          pip install dist/aerospike_async-*.whl

      - name: Install SDK and dev dependencies
        run: |
          pip install -r requirements-dev.txt
          # PAC was installed from the source checkout above. Avoid resolving
          # the temporary direct git dependency during this pre-release window.
          pip install . --no-deps

      - name: Generate ANTLR parser
        run: make generate-ael

      - name: Run unit tests
        run: python -m pytest tests/unit -v

  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      # Pre-release alpha window: PSDK pins to a PAC version that hasn't
      # been published to PyPI yet. Build PAC from source as a sibling so
      # `pip install .` for the SDK finds the dependency already satisfied
      # and doesn't go to PyPI. Switch back to a plain PyPI install once
      # the matching PAC release lands on PyPI.
      - name: Read PAC ref from pyproject.toml
        run: |
          ref=$(grep -oE 'aerospike-client-python-async\.git@[^"]+' pyproject.toml | head -1 | cut -d@ -f2)
          echo "PAC_REF=$ref" >> "$GITHUB_ENV"
      - name: Checkout PAC source (sibling)
        uses: actions/checkout@v4
        with:
          repository: aerospike/aerospike-client-python-async
          ref: ${{ env.PAC_REF }}
          path: aerospike-client-python-async

      - name: Setup Rust toolchain (for PAC build)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Start Aerospike server
        run: |
          # Server image must be >= 8.1.1 so path-expression / ops-projection
          # tests run instead of skipping. 8.1.2+ unlocks the additional
          # native-ExpOp coverage that consumes ``client_with_cdt_data_812``
          # / ``client_812``; tests that need 8.1.2 and don't see an
          # 8.1.2-routing seed (``AEROSPIKE_HOST_8_1_2``) will skip cleanly.
          docker run -d -p 3000:3000 --name aerospike-server aerospike/aerospike-server:8.1.2.1
          for i in {1..10}; do
            if docker exec aerospike-server asinfo -v "statistics" > /dev/null 2>&1; then
              echo "Aerospike server is ready after $i seconds"
              break
            fi
            if [ $i -eq 10 ]; then
              echo "Aerospike server failed to start after 10 seconds"
              docker logs aerospike-server
              exit 1
            fi
            echo "Waiting for Aerospike server... ($i/10)"
            sleep 1
          done
          echo "Configuring namespace for TTL support..."
          docker exec aerospike-server asinfo -v "set-config:context=namespace;id=test;nsup-period=120"
          docker exec aerospike-server asinfo -v "set-config:context=namespace;id=test;default-ttl=2592000"
          echo "=== Server Build ==="
          docker exec aerospike-server asinfo -v "build"

      - name: Build & install PAC from source
        working-directory: aerospike-client-python-async
        run: |
          # `maturin develop` requires an active virtualenv; GitHub-hosted
          # runners use the system Python without one. Build a wheel and
          # `pip install` it instead — same end state, no venv required.
          pip install maturin
          maturin build --release --out dist
          pip install dist/aerospike_async-*.whl

      - name: Install SDK and dev dependencies
        run: |
          pip install -r requirements-dev.txt
          # PAC was installed from the source checkout above. Avoid resolving
          # the temporary direct git dependency during this pre-release window.
          pip install . --no-deps

      - name: Generate ANTLR parser
        run: make generate-ael

      - name: Run integration tests
        env:
          AEROSPIKE_HOST: localhost:3000
          AEROSPIKE_USE_SERVICES_ALTERNATE: "true"
        run: |
          rm -f aerospike.env
          python -m pytest tests/integration -v || TEST_FAILED=true
          if [ "$TEST_FAILED" = "true" ]; then
            echo "=== Aerospike Server Log (last 100 lines) ==="
            docker logs --tail 100 aerospike-server
            echo "=== End of Server Log ==="
            exit 1
          fi

  # Free-threaded (PEP 703) Python builds.  Catches no-GIL regressions that
  # would otherwise land silently: anything that relies on the GIL for
  # de-facto serialization (module-level singletons, dict mutation races,
  # cross-loop asyncio primitives) fails here before it reaches users.
  unit-freethreaded:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.14t']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Read PAC ref from pyproject.toml
        run: |
          ref=$(grep -oE 'aerospike-client-python-async\.git@[^"]+' pyproject.toml | head -1 | cut -d@ -f2)
          echo "PAC_REF=$ref" >> "$GITHUB_ENV"
      - name: Checkout PAC source (sibling)
        uses: actions/checkout@v4
        with:
          repository: aerospike/aerospike-client-python-async
          ref: ${{ env.PAC_REF }}
          path: aerospike-client-python-async
      - name: Setup Rust toolchain (for PAC build)
        # `actions-rs/toolchain` is archived; use the maintained replacement
        # for new jobs.  Existing jobs in this file still use the old action
        # and should be migrated in a separate cleanup pass.
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy
      - name: Setup free-threaded Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build & install PAC from source
        working-directory: aerospike-client-python-async
        run: |
          pip install maturin
          maturin build --release --out dist
          pip install dist/aerospike_async-*.whl
      - name: Install SDK and dev dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install . --no-deps
      - name: Generate ANTLR parser
        run: make generate-ael
      - name: Verify GIL stays disabled after import
        run: |
          python -c "import sys; before = sys._is_gil_enabled(); import aerospike_sdk; after = sys._is_gil_enabled(); print(f'GIL before={before} after={after}'); assert before is False and after is False, 'gil_used = false flag is not being honored'"
      - name: Run unit tests
        run: python -m pytest tests/unit -v

  integration-freethreaded:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.14t']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Read PAC ref from pyproject.toml
        run: |
          ref=$(grep -oE 'aerospike-client-python-async\.git@[^"]+' pyproject.toml | head -1 | cut -d@ -f2)
          echo "PAC_REF=$ref" >> "$GITHUB_ENV"
      - name: Checkout PAC source (sibling)
        uses: actions/checkout@v4
        with:
          repository: aerospike/aerospike-client-python-async
          ref: ${{ env.PAC_REF }}
          path: aerospike-client-python-async
      - name: Setup Rust toolchain (for PAC build)
        # `actions-rs/toolchain` is archived; use the maintained replacement
        # for new jobs.  Existing jobs in this file still use the old action
        # and should be migrated in a separate cleanup pass.
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy
      - name: Setup free-threaded Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Start Aerospike server
        run: |
          docker run -d -p 3000:3000 --name aerospike-server aerospike/aerospike-server:8.1.2.1
          for i in {1..10}; do
            if docker exec aerospike-server asinfo -v "statistics" > /dev/null 2>&1; then
              echo "Aerospike server is ready after $i seconds"
              break
            fi
            if [ $i -eq 10 ]; then
              echo "Aerospike server failed to start after 10 seconds"
              docker logs aerospike-server
              exit 1
            fi
            echo "Waiting for Aerospike server... ($i/10)"
            sleep 1
          done
          echo "Configuring namespace for TTL support..."
          docker exec aerospike-server asinfo -v "set-config:context=namespace;id=test;nsup-period=120"
          docker exec aerospike-server asinfo -v "set-config:context=namespace;id=test;default-ttl=2592000"
          echo "=== Server Build ==="
          docker exec aerospike-server asinfo -v "build"
      - name: Build & install PAC from source
        working-directory: aerospike-client-python-async
        run: |
          pip install maturin
          maturin build --release --out dist
          pip install dist/aerospike_async-*.whl
      - name: Install SDK and dev dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install . --no-deps
      - name: Generate ANTLR parser
        run: make generate-ael
      - name: Verify GIL stays disabled after import
        run: |
          python -c "import sys; before = sys._is_gil_enabled(); import aerospike_sdk; after = sys._is_gil_enabled(); print(f'GIL before={before} after={after}'); assert before is False and after is False, 'gil_used = false flag is not being honored'"
      - name: Run integration tests (smoke)
        env:
          AEROSPIKE_HOST: localhost:3000
          AEROSPIKE_USE_SERVICES_ALTERNATE: "true"
        run: |
          rm -f aerospike.env
          python -m pytest tests/integration -v || TEST_FAILED=true
          if [ "$TEST_FAILED" = "true" ]; then
            echo "=== Aerospike Server Log (last 100 lines) ==="
            docker logs --tail 100 aerospike-server
            exit 1
          fi
