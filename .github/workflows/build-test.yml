name: CI Build & Test

on:
  pull_request:
    branches:
      - dev
      - stage
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  # OIDC token exchange with Artifactory (PAC wheel download).
  id-token: write

env:
  JF_URL: https://artifact.aerospike.io
  # Server build under test. Bump these two to move CI to a different build;
  # list what is available with the registry's docker tags/list endpoint.
  # 8.1.3 is deliberate: it carries the most features, so a single build
  # exercises the most surface. Below it, whole areas skip rather than run --
  # path expressions and ops projection need 8.1.1, native ExpOp coverage
  # needs 8.1.2, and server-compiled AEL, query selection and extended error
  # detail all need 8.1.3.
  AEROSPIKE_SERVER_TAG: "8.1.3.0"
  AEROSPIKE_SERVER_REPO: database-docker-test-local/aerospike-server-enterprise

jobs:
  # Advisory only (never fails the build): confirm the pinned PAC dev version
  # actually exists in the internal dev repo, so a bad pin surfaces as a clear
  # warning instead of a cryptic install failure in every matrix job.
  pac-pin-check:
    name: PAC pin availability (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JFrog CLI
        id: jfrog
        uses: step-security/setup-jfrog-cli@3054b554c0fb4915b3d58847fb7730c593dbb934 # v5.0.0
        env:
          JF_PROJECT: ${{ vars.JFROG_PROJECT }}
        with:
          oidc-provider-name: ${{ vars.OIDC_PROVIDER_NAME || 'gh-aerospike' }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE || 'aerospike' }}

      - name: Check the pinned PAC version exists in the dev repo
        run: |
          set -euo pipefail
          version=$(grep -oE 'aerospike-async==[0-9A-Za-z.]+' pyproject.toml | head -1 | sed 's/aerospike-async==//')
          echo "Pinned PAC version: $version"
          count=$(jf rt search "${{ vars.JFROG_PROJECT }}-pypi-dev-local/aerospike-async/${version}/*.whl" --count || echo 0)
          echo "Wheels found for $version: $count"
          if [ "$count" = "0" ]; then
            echo "::warning title=PAC pin not found in dev repo::aerospike-async==${version} has no wheels in ${{ vars.JFROG_PROJECT }}-pypi-dev-local. Fix the pin in pyproject.toml or publish the version from PAC."
          fi

  # Lint gate: fails the build on any ruff error, so the tree-wide cleanup can't
  # regress. Pure static check — no server or PAC dev-index needed. Ruff is
  # pinned so a new release adding rules can't spuriously break CI.
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff==0.15.12

      - name: Ruff check
        run: ruff check .

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Setup JFrog CLI
        id: jfrog
        uses: step-security/setup-jfrog-cli@3054b554c0fb4915b3d58847fb7730c593dbb934 # v5.0.0
        env:
          JF_PROJECT: ${{ vars.JFROG_PROJECT }}
        with:
          oidc-provider-name: ${{ vars.OIDC_PROVIDER_NAME || 'gh-aerospike' }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE || 'aerospike' }}

      # The pinned aerospike-async dev version resolves from the internal
      # PyPI index (OIDC-minted credentials); everything else comes from
      # public PyPI. --only-binary keeps a missing wheel from degrading
      # into a confusing source build of the Rust extension.
      - name: Install SDK and dev dependencies
        env:
          JF_OIDC_USER: ${{ steps.jfrog.outputs.oidc-user }}
          JF_OIDC_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          set -euo pipefail
          user_enc=$(python -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['JF_OIDC_USER'], safe=''))")
          pip install ".[dev]" --only-binary aerospike-async \
            --extra-index-url "https://${user_enc}:${JF_OIDC_TOKEN}@artifact.aerospike.io/artifactory/api/pypi/${{ vars.JFROG_PROJECT }}-pypi-dev-local/simple/"

      - name: Run unit tests
        run: python -m pytest tests/unit -v

  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Start Aerospike server
        id: aerospike
        uses: aerospike/shared-workflows/.github/actions/setup-aerospike-server@3737237b6907ccb1f0c9c9669c826631912252d8 # INFRA-723 job names (post-v4.1.0)
        with:
          server-tag: ${{ env.AEROSPIKE_SERVER_TAG }}
          server-container-repo: ${{ env.AEROSPIKE_SERVER_REPO }}
          num-nodes: 1
          config-file: .github/aerospike.conf
          oidc-provider: ${{ vars.OIDC_PROVIDER_NAME || 'gh-aerospike' }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE || 'aerospike' }}

      - name: Assert the server is the one we asked for
        env:
          EXPECTED_BUILD: ${{ env.AEROSPIKE_SERVER_TAG }}
        run: python3 .github/assert-server.py

      - name: Setup JFrog CLI
        id: jfrog
        uses: step-security/setup-jfrog-cli@3054b554c0fb4915b3d58847fb7730c593dbb934 # v5.0.0
        env:
          JF_PROJECT: ${{ vars.JFROG_PROJECT }}
        with:
          oidc-provider-name: ${{ vars.OIDC_PROVIDER_NAME || 'gh-aerospike' }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE || 'aerospike' }}

      # The pinned aerospike-async dev version resolves from the internal
      # PyPI index (OIDC-minted credentials); everything else comes from
      # public PyPI. --only-binary keeps a missing wheel from degrading
      # into a confusing source build of the Rust extension.
      - name: Install SDK and dev dependencies
        env:
          JF_OIDC_USER: ${{ steps.jfrog.outputs.oidc-user }}
          JF_OIDC_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          set -euo pipefail
          user_enc=$(python -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['JF_OIDC_USER'], safe=''))")
          pip install ".[dev]" --only-binary aerospike-async \
            --extra-index-url "https://${user_enc}:${JF_OIDC_TOKEN}@artifact.aerospike.io/artifactory/api/pypi/${{ vars.JFROG_PROJECT }}-pypi-dev-local/simple/"

      - name: Run integration tests
        env:
          AEROSPIKE_HOST: localhost:3000
          AEROSPIKE_USE_SERVICES_ALTERNATE: "true"
        run: |
          rm -f aerospike.env
          python -m pytest tests/integration -v || TEST_FAILED=true
          if [ "$TEST_FAILED" = "true" ]; then
            echo "=== Aerospike Server Log (last 100 lines) ==="
            docker logs --tail 100 "${{ steps.aerospike.outputs.container-names }}"
            echo "=== End of Server Log ==="
            exit 1
          fi

  # Free-threaded (PEP 703) Python builds.  Catches no-GIL regressions that
  # would otherwise land silently: anything that relies on the GIL for
  # de-facto serialization (module-level singletons, dict mutation races,
  # cross-loop asyncio primitives) fails here before it reaches users.
  unit-freethreaded:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.14t']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup free-threaded Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Setup JFrog CLI
        id: jfrog
        uses: step-security/setup-jfrog-cli@3054b554c0fb4915b3d58847fb7730c593dbb934 # v5.0.0
        env:
          JF_PROJECT: ${{ vars.JFROG_PROJECT }}
        with:
          oidc-provider-name: ${{ vars.OIDC_PROVIDER_NAME || 'gh-aerospike' }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE || 'aerospike' }}

      # The pinned aerospike-async dev version resolves from the internal
      # PyPI index (OIDC-minted credentials); everything else comes from
      # public PyPI. --only-binary keeps a missing wheel from degrading
      # into a confusing source build of the Rust extension.
      - name: Install SDK and dev dependencies
        env:
          JF_OIDC_USER: ${{ steps.jfrog.outputs.oidc-user }}
          JF_OIDC_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          set -euo pipefail
          user_enc=$(python -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['JF_OIDC_USER'], safe=''))")
          pip install ".[dev]" --only-binary aerospike-async \
            --extra-index-url "https://${user_enc}:${JF_OIDC_TOKEN}@artifact.aerospike.io/artifactory/api/pypi/${{ vars.JFROG_PROJECT }}-pypi-dev-local/simple/"

      - name: Verify GIL stays disabled after import
        run: |
          python -c "import sys; before = sys._is_gil_enabled(); import aerospike_sdk; after = sys._is_gil_enabled(); print(f'GIL before={before} after={after}'); assert before is False and after is False, 'gil_used = false flag is not being honored'"

      - name: Run unit tests
        run: python -m pytest tests/unit -v

  integration-freethreaded:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.14t']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup free-threaded Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Start Aerospike server
        id: aerospike
        uses: aerospike/shared-workflows/.github/actions/setup-aerospike-server@3737237b6907ccb1f0c9c9669c826631912252d8 # INFRA-723 job names (post-v4.1.0)
        with:
          server-tag: ${{ env.AEROSPIKE_SERVER_TAG }}
          server-container-repo: ${{ env.AEROSPIKE_SERVER_REPO }}
          num-nodes: 1
          config-file: .github/aerospike.conf
          oidc-provider: ${{ vars.OIDC_PROVIDER_NAME || 'gh-aerospike' }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE || 'aerospike' }}

      - name: Assert the server is the one we asked for
        env:
          EXPECTED_BUILD: ${{ env.AEROSPIKE_SERVER_TAG }}
        run: python3 .github/assert-server.py

      - name: Setup JFrog CLI
        id: jfrog
        uses: step-security/setup-jfrog-cli@3054b554c0fb4915b3d58847fb7730c593dbb934 # v5.0.0
        env:
          JF_PROJECT: ${{ vars.JFROG_PROJECT }}
        with:
          oidc-provider-name: ${{ vars.OIDC_PROVIDER_NAME || 'gh-aerospike' }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE || 'aerospike' }}

      # The pinned aerospike-async dev version resolves from the internal
      # PyPI index (OIDC-minted credentials); everything else comes from
      # public PyPI. --only-binary keeps a missing wheel from degrading
      # into a confusing source build of the Rust extension.
      - name: Install SDK and dev dependencies
        env:
          JF_OIDC_USER: ${{ steps.jfrog.outputs.oidc-user }}
          JF_OIDC_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          set -euo pipefail
          user_enc=$(python -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['JF_OIDC_USER'], safe=''))")
          pip install ".[dev]" --only-binary aerospike-async \
            --extra-index-url "https://${user_enc}:${JF_OIDC_TOKEN}@artifact.aerospike.io/artifactory/api/pypi/${{ vars.JFROG_PROJECT }}-pypi-dev-local/simple/"

      - name: Verify GIL stays disabled after import
        run: |
          python -c "import sys; before = sys._is_gil_enabled(); import aerospike_sdk; after = sys._is_gil_enabled(); print(f'GIL before={before} after={after}'); assert before is False and after is False, 'gil_used = false flag is not being honored'"

      - name: Run integration tests (smoke)
        env:
          AEROSPIKE_HOST: localhost:3000
          AEROSPIKE_USE_SERVICES_ALTERNATE: "true"
        run: |
          rm -f aerospike.env
          python -m pytest tests/integration -v || TEST_FAILED=true
          if [ "$TEST_FAILED" = "true" ]; then
            echo "=== Aerospike Server Log (last 100 lines) ==="
            docker logs --tail 100 "${{ steps.aerospike.outputs.container-names }}"
            exit 1
          fi
