# Single-node strong-consistency cluster for the gated commit tests.
#
# One node owns every partition. Those tests put a TCP proxy in front of the
# seed and call force_single_node(), which keeps that node but does not
# rewrite the partition map. A replication-factor-2 cluster would leave most
# partitions unroutable.
#
# Security stays off. The proxy counts data messages, and an auth handshake
# would spend allowances the tests are counting. The setup action stages the
# roster for namespace test; roster.py is the local equivalent of that step.
#
# proto-fd-max is 1024 because a supplied config makes the action launch with
# --entrypoint asd, so the soft nofile limit stays at the daemon default.

service {
    feature-key-file /etc/aerospike-custom/features.conf
    cluster-name sc_single
    proto-fd-max 1024
}

logging {
    console {
        context any info
    }
}

network {
    service {
        address any
        access-address 127.0.0.1
        port 3000
    }
    heartbeat {
        mode mesh
        address local
        port 3002
        interval 150
        timeout 10
    }
    fabric {
        port 3001
    }
}

namespace test {
    replication-factor 1
    strong-consistency true
    storage-engine memory {
        data-size 512M
    }
}
