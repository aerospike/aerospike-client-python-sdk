# TLS smoke cluster for nightly.
#
# Handed to setup-aerospike-server as config-file. The action still generates
# the certificates and mounts them at the paths below, appends the security
# stanza, and mounts the feature key at the basename of the features-file the
# workflow writes.
#
# alternate-access-address is the address a services-alternate client is told
# to use. Login-only TLS reads service-clear-alt for the cleartext data port.
# address any only makes the process listen; it publishes the container's own
# interface, which is not the runner's 127.0.0.1. The host port mapping keeps
# container port 3000 on host port 3000, so no alternate-access-port is needed.

service {
    feature-key-file /etc/aerospike-custom/features.conf
    cluster-name docker
    proto-fd-max 15000
}

logging {
    console {
        context any info
    }
}

network {
    tls aerospike-tls {
        cert-file /etc/aerospike/tls/server.crt
        key-file  /etc/aerospike/tls/server.key
        ca-file   /etc/aerospike/tls/ca.crt
    }
    service {
        address any
        port 3000
        alternate-access-address 127.0.0.1
        tls-port 4333
        tls-authenticate-client false
        tls-name aerospike-tls
    }
    heartbeat {
        mode mesh
        port 3002
    }
    fabric {
        port 3001
    }
}

namespace test {
    replication-factor 1
    storage-engine memory {
        data-size 1G
    }
}
