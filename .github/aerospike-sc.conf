# 3-node strong-consistency cluster for nightly integration runs.
#
# Handed to setup-aerospike-server as config-file. The action injects mesh
# seeds after `mode mesh`, appends the security stanza, and mounts the feature
# key at the path below (the basename of the features-file the workflow
# writes, on the action's config volume). It does not rewrite namespace
# blocks, so the SC settings live here.
#
# The action's generated SC namespace turns strong-consistency-allow-expunge
# on and sets no nsup period. Leave expunge at the server default: the
# durable-delete suite asserts that a non-durable delete is forbidden. nsup
# and default-ttl match .github/aerospike.conf so the expiration suites still
# have a clock.
#
# proto-fd-max is 1024 for the same reason as .github/aerospike.conf: a
# supplied config makes the action launch with `--entrypoint asd`, and asd
# refuses to start when this exceeds the soft nofile limit.

service {
    feature-key-file /etc/aerospike-custom/features.conf
    cluster-name docker
    proto-fd-max 1024
}

logging {
    console {
        context any info
    }
}

network {
    service {
        address any
        port 3000
    }
    heartbeat {
        mode mesh
        address any
        port 3002
        interval 150
        timeout 10
    }
    fabric {
        address any
        port 3001
    }
}

namespace test {
    replication-factor 2
    strong-consistency true
    default-ttl 2592000
    nsup-period 120
    storage-engine device {
        file /opt/aerospike/data/test.dat
        filesize 1G
    }
}
