# Aerospike server configuration for CI integration runs.
#
# Handed to the shared setup-aerospike-server action as `config-file`, which
# passes it through verbatim -- it is the file the server reads, so no template
# variables belong here.
#
# The enterprise images run in evaluation mode: no `feature-key-file` directive,
# which the action emits only when a features file is supplied. Evaluation mode
# covers everything this suite needs; a real key is required only for strong
# consistency and multi-node clusters, neither of which CI runs today.

service {
    cluster-name docker
    # 1024 is the only value that works on every runner, and it is load-bearing.
    # Supplying a config makes the shared action launch the image with
    # `--entrypoint asd`, skipping the entrypoint that would otherwise raise the
    # soft file-descriptor limit to the hard limit from `--ulimit nofile=15000`.
    # The soft limit therefore stays at the Docker daemon default, which is 1024
    # on the self-hosted macOS runner. asd refuses to start when proto-fd-max
    # exceeds the soft limit, and separately rejects anything below 1024 -- so
    # the two bounds meet at exactly this value. Ample for a single test client.
    proto-fd-max 1024
}

logging {
    console {
        context any info
    }
}

network {
    service {
        address any
        port 3000
    }
    heartbeat {
        mode mesh
        port 3002
    }
    fabric {
        port 3001
    }
}

# `nsup-period` and `default-ttl` used to be applied after startup with asinfo.
# The enterprise images ship no asinfo binary, so they are set statically here;
# expiration is off by default and several suites depend on it running.
namespace test {
    replication-factor 1
    default-ttl 2592000
    nsup-period 120
    storage-engine memory {
        data-size 1G
    }
}
