# 3-node in-memory strong-consistency cluster for nightly integration runs.
#
# Same cluster as .github/aerospike-sc.conf, with storage-engine memory in
# place of the device file. Nightly runs this in its own job, beside the
# persistent-storage job. Handed to setup-aerospike-server as config-file.
# For a multi-node cluster the action inserts mesh seeds after the first line that names the
# heartbeat mode, so that name must appear only on the heartbeat stanza below.
# It mounts the feature key at the path below. Security is left off.
#
# Leave expunge at the server default: the durable-delete suite asserts that
# a non-durable delete is forbidden. nsup and default-ttl match
# .github/aerospike.conf so the expiration suites still have a clock.
#
# proto-fd-max is 1024 because a supplied config makes the action launch with
# --entrypoint asd, so the soft nofile limit stays at the daemon default.

service {
    feature-key-file /etc/aerospike-custom/features.conf
    cluster-name docker
    proto-fd-max 1024
}

logging {
    console {
        context any info
    }
}

network {
    service {
        address any
        port 3000
    }
    heartbeat {
        mode mesh
        address any
        port 3002
        interval 150
        timeout 10
    }
    fabric {
        address any
        port 3001
    }
}

namespace test {
    replication-factor 2
    strong-consistency true
    default-ttl 2592000
    nsup-period 120
    storage-engine memory {
        data-size 1G
    }
}
