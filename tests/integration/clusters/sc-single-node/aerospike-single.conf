# Single-node strong-consistency cluster, for tests that need every partition
# owned by one node.
#
# Why a second SC cluster: the 3-node SC cluster is replication-factor 2, so a
# client restricted to one node (force_single_node) has no route to the
# partitions that node does not own -- this client does not rewrite the
# partition map the way the Java and C clients do. With one node owning all
# 4096 partitions the restriction is consistent, which is what the TCP-gate
# commit tests need.
#
# Security is deliberately off: the gate tests connect through a proxy, and an
# auth handshake would consume gate allowances that the tests are counting.
service {
    cluster-name sc_single
    # Pinned: the derived default follows the interface MAC, which podman
    # randomizes per container start, and a changed node ID invalidates the
    # persisted strong-consistency roster.
    node-id BB9515AE1E00001
    feature-key-file /etc/aerospike/features.conf
    proto-fd-max 15000
}
logging {
    console {
        context any info
    }
}
network {
    service {
        address any
        access-address 127.0.0.1
        port 3130
    }
    heartbeat {
        mode mesh
        address local
        port 3132
        interval 150
        timeout 10
    }
    fabric {
        port 3131
    }
    info {
        port 3133
    }
}
namespace test_sc {
    index-stage-size 128M
    sindex-stage-size 128M
    replication-factor 1
    strong-consistency true
    storage-engine memory {
        data-size 512M
    }
}
